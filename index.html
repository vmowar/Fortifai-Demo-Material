<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>fortifai · Confidential Partner Briefing Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Official Fortifai Design System v2.0 Tokens */
    --nav: #0D1520;
    --navy-card: #111C2B;
    --brand-blue: #6699CC;
    --deep-blue: #2E5A8A;
    --steel-blue: #99AFBC;
    --tx: #333333;
    --tx-2: #6B7280;
    --tx-3: #9CA3AF;
    --border: #E5E7EB;
    --bg: #F2F4F7;
    --white: #FFFFFF;
    --sev-critical: #C62828;
    --sev-critical-bg: #FDECEC;
    --sev-critical-tx: #8B1A1A;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
  }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background-color: var(--nav);
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-variant-numeric: tabular-nums;
  }

  /* Block printing / Save-as-PDF of the portal */
  @media print {
    body { display: none !important; }
  }

  /* Top Header — Official #0D1520 (--nav) */
  .topbar {
    background: var(--nav);
    border-bottom: 1px solid rgba(102, 153, 204, 0.22);
    padding: 12px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo-lockup {
    display: inline-flex;
    align-items: baseline;
    gap: 5px;
  }
  .logo-mark {
    width: 12px;
    height: 14px;
    background: var(--brand-blue);
    clip-path: polygon(0 32%, 100% 0, 100% 100%, 0 100%);
    display: inline-block;
    transform: translateY(1px);
  }
  .wordmark {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--white);
  }
  .badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--brand-blue);
    background: rgba(46, 90, 138, 0.28);
    border: 1px solid rgba(102, 153, 204, 0.35);
    padding: 3px 8px;
    border-radius: 3px;
  }
  .viewer-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--steel-blue);
    font-variant-numeric: tabular-nums;
  }

  /* Gate Modal Screen — Sized to fit 100% in viewport without scrolling */
  #gate-screen {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px;
  }
  .gate-card {
    max-width: 520px;
    width: 100%;
    background: var(--navy-card);
    border: 1px solid rgba(102, 153, 204, 0.25);
    border-top: 3px solid var(--brand-blue);
    border-radius: 6px;
    padding: 24px 28px;
  }
  .gate-card h1 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--white);
  }
  .gate-card p.sub {
    font-size: 12.5px;
    color: var(--steel-blue);
    line-height: 1.45;
    margin-bottom: 16px;
  }
  .form-group {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--brand-blue);
    margin-bottom: 5px;
  }
  .form-group input {
    width: 100%;
    padding: 9px 12px;
    background: var(--nav);
    border: 1px solid #263548;
    border-radius: 4px;
    color: var(--white);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    user-select: text;
    -webkit-user-select: text;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--brand-blue);
  }

  /* Terms Box */
  .terms-box {
    background: var(--nav);
    border: 1px solid #1E2D40;
    border-radius: 4px;
    padding: 10px 12px;
    height: 100px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.5;
    color: var(--tx-3);
    margin-bottom: 12px;
  }
  .terms-box strong {
    color: var(--white);
    font-weight: 600;
  }

  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 12px;
    color: #E5E7EB;
    line-height: 1.4;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .checkbox-row input {
    margin-top: 2px;
    accent-color: var(--deep-blue);
    cursor: pointer;
  }

  .btn-unlock {
    width: 100%;
    padding: 10px 14px;
    background: var(--deep-blue);
    color: var(--white);
    border: 1px solid var(--brand-blue);
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-unlock:hover {
    background: #23476E;
  }
  .error-msg {
    background: var(--sev-critical-bg);
    color: var(--sev-critical-tx);
    border-radius: 3px;
    padding: 6px 10px;
    font-size: 11.5px;
    font-weight: 600;
    margin-top: 10px;
    display: none;
  }

  /* Main Data Room Content (Hidden until unlocked) */
  #portal-content {
    display: none;
    flex: 1;
    flex-direction: column;
    max-width: 1160px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 32px 40px;
  }

  .nav-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    border-bottom: 1px solid #1E2D40;
    padding-bottom: 12px;
  }
  .tab-btn {
    background: var(--navy-card);
    color: var(--tx-3);
    border: 1px solid #263548;
    padding: 8px 16px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .tab-btn.active {
    background: var(--deep-blue);
    color: var(--white);
    border-color: var(--brand-blue);
    font-weight: 600;
  }

  /* Viewer Frame with Dynamic Watermark */
  .viewer-container {
    position: relative;
    background: var(--nav);
    border: 1px solid #263548;
    border-radius: 6px;
    overflow: hidden;
    min-height: 620px;
  }
  .watermark-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-around;
    opacity: 0.14;
    overflow: hidden;
  }
  .wm-text {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    color: var(--white);
    transform: rotate(-24deg);
    padding: 60px;
    white-space: nowrap;
  }

  video, iframe {
    width: 100%;
    height: 640px;
    border: none;
    display: block;
  }
</style>
</head>
<body oncontextmenu="return false;">

  <div class="brand">
    <span class="logo-lockup">
      <span class="logo-mark"></span>
      <span class="wordmark">fortifai</span>
    </span>
    <span class="badge">Confidential Partner Data Room</span>
  </div>
  <div class="viewer-tag" id="session-badge">Status: Awaiting Verification</div>
</header>

        <input type="text" id="viewer-name" placeholder="e.g., Partner, Forensic / Risk Advisory" required />
